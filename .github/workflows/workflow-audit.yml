name: Workflow audit

# Static audit of the workflows and dependabot.yml with zizmor on every PR and push
# to main. Fails on high-severity findings (unpinned actions, script injection,
# dangerous triggers).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit .github/workflows
        env:
          # Online audits (impostor commits, known-vulnerable actions) read the public API.
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --strict-collection --min-severity high --format github .github
